name: CI & GitHub Pages Deployment

on:
  push:
    branches: [ main, rc, rc2 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "verify-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # 1. CI Test Suite: syntax integrity & behavioral unit suites (see step names)
  test:
    name: Run Automated Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check README test inventory
        run: node tests/check-readme-test-count.cjs

      - name: Check generated changelog page
        run: node scripts/build-changelog-page.cjs --check

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify all production JavaScript syntax
        run: node tests/run-all.cjs --syntax

      - name: Run every Node regression suite
        run: node tests/run-all.cjs

      - name: Run Performance & Latency Benchmark Suite
        run: node tests/benchmark-performance.js

      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/noiradix-qa" --no-save playwright@1.65.0
          "$RUNNER_TEMP/noiradix-qa/node_modules/.bin/playwright" install --with-deps chromium

      - name: Exercise both editor entry points
        env:
          EDITOR_QA_CHANNEL: chromium
          EDITOR_QA_URL: http://127.0.0.1:8769
        run: |
          export NODE_PATH="$RUNNER_TEMP/noiradix-qa/node_modules"
          python3 -m http.server 8769 --bind 127.0.0.1 > "$RUNNER_TEMP/noiradix-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8769/ > /dev/null
          node tests/run-all.cjs --browser

  release:
    name: Publish verified GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const v = require("./js/version.js"); const tag = process.env.RELEASE_TAG; if (v.studio.displayVersion !== tag || v.pixelart.displayVersion !== tag) throw new Error("Tag and app versions differ");'
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag "${prerelease[@]}" \
            --title "NOIRADIX Studio & PixelArt $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"

  # 2. CD Deployment: Deploy static web application to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

