name: CI & GitHub Pages Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. CI Test Suite: Syntax integrity & 158 automated unit tests across 5 suites
  test:
    name: Run Automated Test Suites (158 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify JavaScript Syntax
        run: |
          node --check js/app.js
          node --check js/pix2-format.js
          node --check js/editor-state.js
          node --check js/animation-player.js
          node --check js/tools.js
          node --check pix2/js/pix2-format.js
          node --check pixelart/js/pixelart-app.js

      - name: Run Semantic Roundtrip & Feature Tests (96 Tests)
        run: node tests/test-roundtrip.js

      - name: Run Security & Anti-DoS Defense Tests (21 Tests)
        run: node tests/test-security.js

      - name: Run TextMate Regex Pattern & Capture Group Tests (6 Checks)
        run: node tests/test-tmLanguage.js

      - name: Run Normative Test Vector Conformance Tests (11 Tests)
        run: node tests/test-vectors-conformance.js

      - name: Run Audit Data Integrity & Regression Tests
        run: node tests/test-audit-integrity.js

  # 2. CD Deployment: Deploy static web application to GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

